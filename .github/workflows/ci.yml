name: CI

# GENERATED from qyvora-dist/ci.template.yml — do not edit by hand.
# Change the template + qyvora-dist/tools.def, then run qyvora-dist/generate.sh.
#
# Per-tool continuous integration: formatting, vet, tests, and one clean
# linux/amd64 build from a clean checkout. The build is deliberately separate
# from the test step so a passing test run cannot hide a build that only works
# because of a dirty tree or a cached object.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Configure private module access
        env:
          QYVORA_CI_TOKEN: ${{ secrets.QYVORA_CI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${QYVORA_CI_TOKEN:-}" ]; then
            echo "::error::QYVORA_CI_TOKEN repository secret is required to fetch private QYVORA modules; see ci-audit/REPORT.md"
            exit 1
          fi
          git config --global "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$QYVORA_CI_TOKEN" | base64 -w0)"
          go env -w GOPRIVATE=github.com/QYVORA/*
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (echo "files need gofmt:"; gofmt -l .; exit 1)

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Clean build (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...
