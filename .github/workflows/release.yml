name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: shaka-linux-amd64
          - goos: linux
            goarch: arm64
            name: shaka-linux-arm64
          - goos: darwin
            goarch: amd64
            name: shaka-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: shaka-darwin-arm64
          - goos: windows
            goarch: amd64
            name: shaka-windows-amd64.exe
          - goos: windows
            goarch: arm64
            name: shaka-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build binary
        # Stamp version metadata via the current module path; a stale module
        # path here would silently no-op and release binaries reporting "dev".
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath \
            -ldflags "-s -w \
            -X github.com/QYVORA/qyvora-shaka/internal/version.Version=${{ github.ref_name }} \
            -X github.com/QYVORA/qyvora-shaka/internal/version.Commit=${{ github.sha }} \
            -X github.com/QYVORA/qyvora-shaka/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/${{ matrix.name }} ./cmd/shaka

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  checksums:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
