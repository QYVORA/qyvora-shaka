name: release

# GENERATED from qyvora-dist/release.template.yml — do not edit by hand.
# Change the template + qyvora-dist/tools.def, then run qyvora-dist/generate.sh.
#
# Publishing rules this workflow enforces:
#   1. Assets are named "{tool}_{version}_{os}_{arch}.tar.gz" (zip on windows),
#      where version is the tag without its leading "v" and darwin is published
#      as "macos". install.sh derives the same names from the resolved latest
#      tag. The exact set a tool must ship comes from its Q_OS policy in
#      tools.def, so a tool that can only build for linux never promises a
#      darwin or windows asset.
#   2. The release is created as a DRAFT by GoReleaser. It is published only
#      after every required asset is present, so "latest" never points at a
#      release that is missing a platform.
#   3. If anything fails before publishing, the draft is deleted so the previous
#      good release stays "latest".
#   4. A post-publish job re-checks the published release independently: that
#      /releases/latest is this tag, that all required platform assets plus
#      checksums.txt exist, and that the linux/amd64 artifact passes its
#      checksum and reports the tag from `--version`.
#
# Actions are pinned to a full commit SHA and each job declares the least
# privilege it needs.

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TOOL: shaka

jobs:
  goreleaser:
    name: build and publish (draft until complete)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod

      - name: Install cross-compilation build dependencies
        # Only tools with  != '' (i.e. cgo tools like toha3ee
        # binding libpcap) need these; the step is skipped everywhere else.
        if: ${{ '' != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates

      - name: Run GoReleaser (creates a draft release)
        uses: goreleaser/goreleaser-action@286f3b13b1b49da4ac219696163fb8c1c93e1200 # v6.0.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gate: never publish a partially-uploaded release. If any required asset
      # is missing the step fails, the failure handler deletes the draft, and
      # "latest" keeps pointing at the previous good release.
      - name: Verify the draft contains every asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TOOL: shaka
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$ASSETS" | sort
          missing=0
          for name in \
            "${TOOL}_${VERSION}_linux_amd64.tar.gz" \
            "${TOOL}_${VERSION}_linux_arm64.tar.gz" \
            "${TOOL}_${VERSION}_macos_amd64.tar.gz" \
            "${TOOL}_${VERSION}_macos_arm64.tar.gz" \
            "${TOOL}_${VERSION}_windows_amd64.zip" \
            "${TOOL}_${VERSION}_windows_arm64.zip"
            checksums.txt; do
            if ! printf '%s\n' "$ASSETS" | grep -qx "$name"; then
              echo "::error::missing required asset: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::refusing to publish an incomplete release"
            exit 1
          fi
          echo "all required assets are present"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Delete the draft on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo "")
          if [ "$is_draft" = "true" ]; then
            echo "deleting incomplete draft release $TAG"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          fi

  post-publish-check:
    name: verify the published release
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify latest points at this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # GitHub's "latest" pointer can lag a few seconds behind a publish.
          for i in 1 2 3 4 5 6; do
            LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            if [ "$LATEST" = "$TAG" ]; then
              echo "/releases/latest is $TAG"
              exit 0
            fi
            echo "attempt $i: /releases/latest is $LATEST, expected $TAG; retrying"
            sleep 5
          done
          echo "::error::/releases/latest never became $TAG"
          exit 1

      - name: Verify every asset is present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TOOL: shaka
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for name in \
            "${TOOL}_${VERSION}_linux_amd64.tar.gz" \
            "${TOOL}_${VERSION}_linux_arm64.tar.gz" \
            "${TOOL}_${VERSION}_macos_amd64.tar.gz" \
            "${TOOL}_${VERSION}_macos_arm64.tar.gz" \
            "${TOOL}_${VERSION}_windows_amd64.zip" \
            "${TOOL}_${VERSION}_windows_arm64.zip"
            checksums.txt; do
            if ! printf '%s\n' "$ASSETS" | grep -qx "$name"; then
              echo "::error::missing asset: $name"
              exit 1
            fi
          done

      - name: Verify the linux/amd64 artifact (checksum and version)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TOOL: shaka
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          cd "$(mktemp -d)"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "${TOOL}_${VERSION}_linux_amd64.tar.gz" \
            --pattern "checksums.txt"
          grep "${TOOL}_${VERSION}_linux_amd64.tar.gz" checksums.txt | sha256sum -c -
          tar xzf "${TOOL}_${VERSION}_linux_amd64.tar.gz"
          chmod +x "$TOOL"
          INSTALLED=$("./$TOOL" --version 2>/dev/null | head -1 | tr -d '\r\n')
          # The exact --version line differs per tool ("1.1.0" vs "tool 1.1.0"),
          # so require the version to appear rather than matching the whole line.
          case "$INSTALLED" in
            *"$VERSION"*) ;;
            *)
              echo "::error::installed --version is '$INSTALLED', expected to contain '$VERSION' (tag $TAG)"
              exit 1
              ;;
          esac
          echo "linux/amd64 artifact verified: $INSTALLED"
