# GENERATED from qyvora-dist/goreleaser.template.yaml — do not edit by hand.
# Change the template + qyvora-dist/tools.def, then run qyvora-dist/generate.sh.
#
# This is the config the release workflow runs. It is rendered from the same
# qyvora-dist/tools.def metadata as install.sh, so the target list, the artifact
# naming and the installer can never drift apart.
#
# Artifact names are the join between three independent implementations: this
# config, install.sh and each tool's self-updater. They are:
#
#   {tool}_{version}_{os}_{arch}.tar.gz   os = linux | macos | windows | android
#   {tool}_{version}_{os}_{arch}.zip      (windows only)
#   checksums.txt                         one sha256 manifest for the whole release
#
# {{ .Version }} is the tag with its leading "v" stripped (GoReleaser semantics),
# and .Os is remapped darwin -> macos because the installer and self-updaters
# use "macos". A plain {{ .Os }} is what once produced assets no installer could
# resolve.
#
# The release is created as a DRAFT. release.template.yml verifies every asset
# is present, then publishes it and deletes the draft if anything failed, so
# "latest" keeps pointing at the previous good release on a partial run.

version: 2

project_name: shaka

before:
  hooks:
    - go mod tidy

builds:
  - id: shaka
    main: ./cmd/shaka
    goos:
      - linux
      - darwin
      - windows
      - android
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/QYVORA/qyvora-shaka/internal/version.Version={{ .Version }}
      - -X github.com/QYVORA/qyvora-shaka/internal/version.Commit={{ .FullCommit }}
      - -X github.com/QYVORA/qyvora-shaka/internal/version.Date={{ .Date }}
      - -X github.com/QYVORA/qyvora-shaka/internal/version.BuildUser=goreleaser
    env:
      - CGO_ENABLED=0

archives:
  - id: shaka
    ids:
      - shaka
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os | replace "darwin" "macos" }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  draft: true
  github:
    owner: QYVORA
    name: qyvora-shaka
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
